name: Publish model catalog and privacy policy
on:
  push:
    branches: [main]
    paths:
      - models.json
      - lib.js
      - privacy/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Validate the model catalog and stage the Pages site
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {validateCatalog} from "./lib.js"; validateCatalog(JSON.parse(readFileSync("models.json", "utf8")))'
          mkdir -p site/privacy
          cp models.json site/
          cp privacy/index.html site/privacy/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
