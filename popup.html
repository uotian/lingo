<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lingo</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <h1 id="view-title">Lingo</h1>
      <output
        id="translation-result"
        aria-label="翻訳済み件数／対象件数と概算料金"
      >
        <span id="translation-count"></span>
        <span id="translation-cost"></span>
      </output>
      <button
        id="settings-toggle"
        class="quiet"
        aria-controls="settings-view"
        aria-expanded="false"
      >
        設定
      </button>
    </header>
    <main>
      <section id="main-view" aria-label="ページ翻訳">
        <div class="languages">
          <select
            id="source-language"
            aria-label="翻訳元の言語"
            disabled
          ></select>
          <svg
            width="9"
            height="14"
            viewBox="0 0 9 14"
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M0 0 9 7 0 14Z" />
          </svg>
          <select
            id="target-language"
            aria-label="翻訳先の言語"
            disabled
          ></select>
          <button id="translate" class="primary" disabled>翻訳</button>
        </div>
        <div class="display-modes" role="group" aria-label="このページの表示">
          <button
            type="button"
            data-mode="original"
            aria-pressed="true"
            disabled
          >
            原文
          </button>
          <button
            type="button"
            data-mode="bilingual"
            aria-pressed="false"
            disabled
          >
            対訳
          </button>
          <button
            type="button"
            data-mode="translated"
            aria-pressed="false"
            disabled
          >
            全訳
          </button>
        </div>
        <p id="progress" class="status" role="status"></p>
        <div class="site-option">
          <span
            ><span id="site-label">このサイトを自動翻訳</span
            ><small id="site-host"></small
          ></span>
          <input
            id="site-auto"
            type="checkbox"
            role="switch"
            aria-labelledby="site-label"
            aria-describedby="site-host"
            disabled
          />
        </div>
      </section>
      <section id="settings-view" aria-label="翻訳の設定" hidden>
        <form id="settings-form">
          <div class="key-heading">
            <label for="api-key"
              >APIキー <small id="key-state">未設定</small></label
            >
            <button id="forget" type="button" class="quiet danger" disabled>
              キーを削除
            </button>
          </div>
          <input
            id="api-key"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="sk-…"
            maxlength="1024"
          />

          <label for="model">モデル</label>
          <select id="model" required></select>

          <label for="base-url">Base URL <small>任意</small></label>
          <input
            id="base-url"
            type="url"
            placeholder="https://api.openai.com/v1"
            autocomplete="off"
            spellcheck="false"
            maxlength="2048"
            aria-describedby="url-help"
          />
          <p id="url-help" class="help">
            OpenAI互換APIを使う場合に入力してください。
          </p>

          <div class="form-actions">
            <button id="save" type="submit" class="primary">保存</button>
          </div>
        </form>
      </section>
      <p id="message" class="status" role="status"></p>
    </main>
    <footer id="settings-footer" hidden>
      <span
        id="usage-total"
        title="この端末で翻訳したページ数と、料金を計算できた応答の累計"
      ></span>
      <button
        type="button"
        class="quiet"
        id="clear-total"
        aria-label="累計をクリア"
        disabled
      >
        クリア
      </button>
    </footer>
  </body>
</html>
