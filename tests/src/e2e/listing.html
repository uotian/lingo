        margin: 24px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 10px;
        border-block: 1px solid #888;
      }
      td:first-child {
        width: 15%;

      }
      td > a.title {
        color: #246aa1;

      }
      td > a.title:hover,

      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #151515;
          color: #eee;
        }
        td {
          border-color: #444;
        }
